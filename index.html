<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibrahim Portfolio Drive</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #60a5fa;
      --secondary-color: #a855f7;
      --bg-color: #0a0f1f;
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #f1f5f9;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-color), #111827);
      color: var(--text-color);
      text-align: center;
      padding: 50px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      margin-bottom: 50px;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
        from { opacity: 0.8; }
        to { opacity: 1; }
    }

    .input-box {
      background: var(--card-bg);
      backdrop-filter: blur(8px); /* Increased blur for stronger effect */
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px; /* More rounded */
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
      transition: all 0.6s ease;
      animation: floatIn 1s ease-out; /* Initial animation */
    }
    
    @keyframes floatIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .input-container {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      width: 100%;
      position: relative;
    }

    input {
      flex-grow: 1;
      padding: 14px 18px;
      padding-right: 50px;
      border: none; /* No border for cleaner look */
      border-radius: 12px;
      font-size: 17px;
      background: rgba(255,255,255,0.1);
      color: var(--text-color);
      outline: none;
      transition: background 0.3s, box-shadow 0.3s;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3);
    }

    input:focus {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 0 2px var(--secondary-color), inset 0 0 8px rgba(0, 0, 0, 0.5);
    }

    .toggle-eye {
      position: absolute;
      right: 15px;
      cursor: pointer;
      font-size: 22px;
      color: #94a3b8;
      transition: color 0.3s, transform 0.1s;
      z-index: 10;
    }
    
    .toggle-eye:hover {
        color: var(--primary-color);
        transform: scale(1.1);
    }

    button {
      background: linear-gradient(90deg, #3b82f6, #9333ea);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      margin-top: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-weight: 600;
      letter-spacing: 1px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
    }

    button:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.6);
    }
    
    /* Secondary button style (Open in New Tab) */
    #pdfFrame a button {
        background: none;
        border: 2px solid var(--primary-color);
        margin-top: 25px;
        color: var(--primary-color);
        width: auto;
        padding: 12px 25px;
        font-size: 16px;
        box-shadow: none;
    }
    
    #pdfFrame a button:hover {
        background: var(--primary-color);
        color: var(--bg-color);
        box-shadow: 0 5px 15px rgba(96, 165, 250, 0.5);
        transform: translateY(-2px);
    }

    iframe {
      width: 100%;
      max-width: 1000px;
      height: 400px; /* 403 এরর এড়াতে ছোট করা হয়েছে */
      border: none;
      border-radius: 15px;
      margin-top: 40px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.3), 0 0 50px rgba(168, 85, 247, 0.2);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* Custom Loading Spinner */
    #loading {
      display: none;
      font-size: 18px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      color: var(--primary-color);
      font-weight: 600;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid var(--secondary-color);
      border-radius: 50%;
      width: 25px;
      height: 25px;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #pdfFrame {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 95%;
        max-width: 1000px;
        animation: fadeIn 1s ease-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>ইব্রাহিম পোর্টফোলিও ড্রাইভ</h1>

  <div id="passwordBox" class="input-box">
    <div class="input-container">
        <input type="password" id="password" placeholder="গোপন পাসওয়ার্ড লিখুন">
        <span class="toggle-eye" id="toggleEye" onclick="togglePassword()">
            </span>
    </div>
    <button onclick="checkPassword()" id="loginButton">প্রবেশ করুন</button>
  </div>

  <div id="loading">
      <div class="spinner"></div>
      ফোল্ডার লোড হচ্ছে...
  </div>

  <div id="pdfFrame" style="display:none;">
    <p style="color:#fca5a5; margin-bottom: 5px;">⚠️ নিরাপত্তা জনিত কারণে এখানে সম্পূর্ণ ফোল্ডার নাও দেখা যেতে পারে।</p>
    
    <iframe id="driveFrame" src="" title="Google Drive Folder"></iframe>
    <br>
    <a href="https://drive.google.com/drive/folders/120Oik4IOnggEJsdMBECNa0mGx4GP4hJD?usp=sharing" target="_blank">
      <button>📂 ফোল্ডারটি নতুন ট্যাবে খুলুন</button>
    </a>
  </div>

  <script>
    // এখানে আপনার মূল ফোল্ডারের ID টি ব্যবহার করুন: 120Oik4IOnggEJsdMBECNa0mGx4GP4hJD
    const DRIVE_FOLDER_ID = "120Oik4IOnggEJsdMBECNa0mGx4GP4hJD";
    const EMBED_URL = `https://drive.google.com/embeddedfolderview?id=${DRIVE_FOLDER_ID}`;
    const PASSWORD = "ibrahimmahmud21";

    function checkPassword() {
      const passwordInput = document.getElementById("password");
      const loginButton = document.getElementById("loginButton");
      
      // লোডিং স্টাইল
      loginButton.textContent = "চেক করা হচ্ছে...";
      loginButton.disabled = true;
      loginButton.style.opacity = "0.7";
      
      const password = passwordInput.value;
      if (password === PASSWORD) {
        
        // পাসওয়ার্ড বক্স অদৃশ্য করার জন্য মসৃণ ট্রানজিশন
        document.getElementById("passwordBox").style.opacity = "0";
        document.getElementById("passwordBox").style.transform = "translateY(-40px) scale(0.9)";

        setTimeout(() => {
          document.getElementById("passwordBox").style.display = "none";
          document.getElementById("loading").style.display = "flex"; // flex করা হয়েছে
        }, 600); 

        // ফোল্ডার লোড করার জন্য অপেক্ষা
        setTimeout(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("pdfFrame").style.display = "flex";
          
          // 403 এরর এড়াতে নতুন এমবেড URL ব্যবহার
          document.getElementById("driveFrame").src = EMBED_URL;
        }, 2500); // 2.5 সেকেন্ড অপেক্ষা
      } else {
        alert("❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
        // লোডিং স্টাইল রিমুভ ও বাটন স্বাভাবিক করা
        loginButton.textContent = "প্রবেশ করুন";
        loginButton.disabled = false;
        loginButton.style.opacity = "1";
        
        // ভুলের জন্য শেক এফেক্ট
        const passwordBox = document.getElementById("passwordBox");
        passwordBox.style.animation = "shake 0.5s";
        setTimeout(() => {
            passwordBox.style.animation = "floatIn 1s ease-out"; // অ্যানিমেশন রিসেট
        }, 500);
      }
    }
    
    // শেক অ্যানিমেশন CSS (জাভাস্ক্রিপ্ট দিয়ে তৈরি, তাই HTML/CSS কোডে না দিলেও চলবে)
    const styleSheet = document.createElement("style");
    styleSheet.type = "text/css";
    styleSheet.innerText += "@keyframes shake { 0% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } 100% { transform: translateX(0); } }";
    document.head.appendChild(styleSheet);


    function togglePassword() {
      const input = document.getElementById("password");
      const eyeSpan = document.getElementById("toggleEye");
      
      if (input.type === "password") {
          input.type = "text";
          eyeSpan.textContent = "🙈"; 
      } else {
          input.type = "password";
          eyeSpan.textContent = "👁️"; 
      }
    }
    
    // ইনিশিয়াল আইকন সেট করা
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("toggleEye").textContent = "👁️";
    });

    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
