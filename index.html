<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibrahim Portfolio Drive</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0f1f, #111827);
      color: #f1f5f9;
      text-align: center;
      padding: 50px 10px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      margin-bottom: 30px;
    }

    .input-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
    }

    input {
      padding: 10px;
      width: 220px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
      text-align: center;
    }

    .toggle-eye {
      margin-left: 8px;
      cursor: pointer;
      font-size: 18px;
      vertical-align: middle;
      color: #94a3b8;
    }

    button {
      background: linear-gradient(90deg, #3b82f6, #9333ea);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #2563eb, #7e22ce);
    }

    iframe {
      width: 90%;
      height: 600px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    #loading {
      display: none;
      color: #93c5fd;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Ibrahim Portfolio Drive</h1>

  <div id="passwordBox" class="input-box">
    <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
    <br>
    <button onclick="checkPassword()">প্রবেশ করুন</button>
  </div>

  <div id="loading">🔄 ফোল্ডার লোড হচ্ছে...</div>

  <div id="pdfFrame" style="display:none;">
    <iframe id="driveFrame" src=""></iframe>
    <br>
    <a href="https://drive.google.com/drive/folders/120Oik4IOnggEJsdMBECNa0mGx4GP4hJD?usp=sharing" target="_blank">
      <button>📂 নতুন ট্যাবে খুলুন</button>
    </a>
  </div>

  <script>
    function checkPassword() {
      const password = document.getElementById("password").value;
      if (password === "ibrahimmahmud21") {
        document.getElementById("passwordBox").style.display = "none";
        document.getElementById("loading").style.display = "block";

        setTimeout(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("pdfFrame").style.display = "block";
          document.getElementById("driveFrame").src =
            "https://drive.google.com/drive/folders/120Oik4IOnggEJsdMBECNa0mGx4GP4hJD?usp=sharing";
        }, 1500);
      } else {
        alert("❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
      }
    }

    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
