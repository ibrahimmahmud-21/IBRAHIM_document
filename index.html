<!DOCTYPE html>
<html>
<head>
  <title>My Protected PDF</title>
  <script>
    function checkPassword() {
      var password = document.getElementById("password").value;
      if (password === "ibrahimmahmud21") {
        document.getElementById("pdfFrame").style.display = "block";
        document.getElementById("passwordBox").style.display = "none";
      } else {
        alert("❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
      }
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

  <div id="passwordBox">
    <h2>🔐 ফাইল দেখার জন্য পাসওয়ার্ড দিন</h2>
    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
    <button onclick="checkPassword()">সাবমিট</button>
  </div>

  <div id="pdfFrame" style="display:none; margin-top: 20px;">
    <iframe src="https://drive.google.com/drive/folders/120Oik4IOnggEJsdMBECNa0mGx4GP4hJD?usp=sharing" width="90%" height="600"></iframe>
    
    <br><br>

    <!-- 🔽 ফোল্ডার খুলতে -->
    <a href="https://drive.google.com/drive/folders/120Oik4IOnggEJsdMBECNa0mGx4GP4hJD?usp=sharing" target="_blank">
      <button style="padding: 10px 20px; font-size: 16px;">📂 ফোল্ডার খুলুন</button>
    </a>
  </div>

</body>
</html>
